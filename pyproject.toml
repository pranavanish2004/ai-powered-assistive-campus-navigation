[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-nav-assistant"
version = "0.2.0"
description = "AI Campus Navigation Assistant for Visually Impaired Students — IIT Hyderabad pilot"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary - Pilot Project (IIT Hyderabad)" }
authors = [{ name = "Pranav" }]
keywords = ["accessibility", "navigation", "computer-vision", "assistive-technology"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies for Phase 1.1 + Phase 1.2.
# All versions below are verified compatible with Python 3.10-3.12.
# Heavy/optional Phase 1.3+ dependencies (Whisper, YOLO, OCR, etc.) live in
# the optional-dependencies groups below and are NOT installed by default.
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<2.1",
    "opencv-python>=4.10,<5.0",
    "numpy>=1.26,<2.0",
    "pyttsx3>=2.98,<3.0",
    "httpx>=0.27,<0.28",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# Speech-to-text stack, split out because openai-whisper pulls in heavy ML
# dependencies (torch, numba) that are not needed to develop/test Phase 1.1
# or Phase 1.2, and were previously bundled into the default install by
# mistake. Install with: pip install -e ".[speech]"
speech = [
    "openai-whisper>=20231117",
    "sounddevice>=0.5,<0.6",
]

# Vision Pipeline stack (Phase 1.3), split out for the same reason as
# [speech]: ultralytics/easyocr/torch are heavy ML dependencies not needed
# to develop or test the vision pipeline's core logic -- every component
# has a mock/heuristic default (MockObjectDetector, MockOCRService,
# HeuristicDepthEstimator) that requires none of this. Install with:
# pip install -e ".[vision]"
vision = [
    "ultralytics>=8.2,<9.0",
    "easyocr>=1.7,<2.0",
    "torch>=2.2,<3.0",
]

# RAG stack (Phase 1.4a), split out because sentence-transformers pulls in
# torch. The default 'keyword' backend (pure Python, no embeddings) needs
# none of this. Install with: pip install -e ".[rag]"
rag = [
    "chromadb>=0.5,<0.6",
    "sentence-transformers>=3.0,<4.0",
    "faiss-cpu>=1.8,<2.0",
]

# MLLM provider SDKs (Phase 1.4c). All lightweight (no torch) but kept
# optional since the 'mock' provider is the safe default and most
# development/testing needs no real API credentials at all. The
# 'local_llama' provider needs none of these -- it talks to a local Ollama
# server over plain HTTP using the already-core httpx dependency.
# Install with: pip install -e ".[llm]"
llm = [
    "anthropic>=0.34,<1.0",
    "openai>=1.40,<2.0",
    "google-generativeai>=0.7,<1.0",
]

dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<0.7",
    "black>=24.8,<25.0",
    "isort>=5.13,<6.0",
    "mypy>=1.11,<2.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.urls]
Repository = "https://github.com/iith-accessibility/campus-nav-assistant"

# ---------------------------------------------------------------------------
# setuptools: src layout
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]
include = ["campus_nav*"]

[tool.setuptools.package-data]
campus_nav = ["py.typed"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=campus_nav --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
# Belt-and-suspenders: with `pip install -e .` this is unnecessary (the
# package is importable from anywhere), but declaring it here means
# `python -m pytest` also works in a fresh checkout before the editable
# install has been run, with no manual PYTHONPATH export required.
pythonpath = ["src"]
markers = [
    "unit: fast, hardware- and network-independent tests",
    "integration: tests that exercise multiple modules together (e.g. the API layer)",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["campus_nav"]
branch = true
omit = ["*/api/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]

# ---------------------------------------------------------------------------
# Ruff (lint)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]  # FastAPI's Depends(...) in default args is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]  # allow descriptive test_* names outside snake_case nitpicks

# ---------------------------------------------------------------------------
# Black (format)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

# ---------------------------------------------------------------------------
# isort (import ordering) — configured to agree with Black, avoiding the
# classic isort/black fight over trailing commas and line length.
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]
known_first_party = ["campus_nav"]

# ---------------------------------------------------------------------------
# mypy (static typing)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["campus_nav"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/"]
