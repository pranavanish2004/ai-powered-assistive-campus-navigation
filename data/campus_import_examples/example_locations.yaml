knowledge:
  - id: tihan_note
    title: TiHAN / TiAND Research Datasets
    content: "TiHAN (Technology Innovation Hub on Autonomous Navigation) at IIT Hyderabad produces camera, LiDAR, radar, GNSS, and SLAM datasets for autonomous systems research. These datasets improve perception (object detection, depth estimation benchmarking) via the existing Vision Pipeline's VideoFileCamera adapter -- point camera_video_file_path at TiHAN footage to evaluate the detection/OCR/depth pipeline against it. TiHAN data is not used as the navigation graph; OpenStreetMap and surveyed campus data serve that role."
    category: general

  - id: parking_info
    title: Campus Parking
    content: "Visitor and staff parking is available near the Main Gate. Additional parking areas exist near academic buildings."
    category: general
